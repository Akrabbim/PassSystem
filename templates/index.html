<!DOCTYPE html>
<html>
	<head>
		<title>SciHigh Passes</title>

		<link rel="stylesheet"
			  href="{{ url_for('static', filename='style.css') }}">
			  
	</head>

	<body>

		<div class="user-menu">
			<span class="username">{{ username }}</span>
			<a href="{{ url_for('logout') }}" class="logout-button">
				<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
				Logout
			</a>
		</div>
		
		<form method="POST" action="/add_pass" class="passForm">

			<h2>Create New Pass</h2>

			<div class="form-row">
				<label for="studentName">Student Name</label>
				<input 
					type="text" 
					id="studentName" 
					name="studentName" 
					required
					autofocus>
			</div>

			<div class="form-row">
				<label for="destination">Destination</label>
				<select 
					id="destination" 
					name="destination"
					onchange="toggleOtherField()"
					required>

					<option value="">-- Select Destination --</option>
					<option value="Bathroom">Bathroom</option>
					<option value="Nurse">Nurse</option>
					<option value="Front Office">Front Office</option>
					<option value="Student Services">Student Services</option>
					<option value="Academic Counselor">Academic Counselor</option>
					<option value="Other">Other</option>

				</select>
			</div>

			<div class="form-row">
				<label for="otherDestination">Other</label>
				<input 
					type="text"
					id="otherDestination"
					name="otherDestination"
					disabled>
			</div>

			<div class="submit-row">
				<button type="submit">
					Create Pass
				</button>
			</div>

		</form>
		
		<br />
		<br />
		
		<div id="myPassTable">
			{% with passes=dataSet, show_delete=true, show_teacher=false %}
				{% include "pass_table.html" %}
			{% endwith %}
		</div>
		
		<br />
		<br />
		
		<div id="allPassTable">
			{% with passes=fullSet, show_delete=false, show_teacher=true %}
				{% include "pass_table.html" %}
			{% endwith %}
		</div>


		<script>
		function toggleOtherField() {

			const destination = document.getElementById("destination");
			const otherField = document.getElementById("otherDestination");

			if (destination.value === "Other") {
				otherField.disabled = false;
				otherField.required = true;
			}
			else {
				otherField.disabled = true;
				otherField.required = false;
				otherField.value = "";
			}
		}
		</script>

	</body>
	<script>
		function updateRowColors() {
			const rows = document.querySelectorAll("tbody tr");

			rows.forEach(row => {
				const created = new Date(row.dataset.created);
				const now = new Date();

				const ageMinutes = (now - created) / 60000;

				row.classList.remove("expired-yellow", "expired-red");

				if (ageMinutes >= 12) {
					row.classList.add("expired-red");
				}
				else if (ageMinutes >= 7) {
					row.classList.add("expired-yellow");
				}
			});
		}


		function refreshTables() {

			fetch("/get_my_passes")
				.then(response => response.text())
				.then(data => {
					document.getElementById("myPassTable").innerHTML = data;
					updateRowColors();
				});

			fetch("/get_all_passes/false")
				.then(response => response.text())
				.then(data => {
					document.getElementById("allPassTable").innerHTML = data;
					updateRowColors();
				});
		}


		// Run once when page loads
		updateRowColors();

		// Refresh every 15 seconds
		setInterval(refreshTables, 5000);
	</script>
</html>
